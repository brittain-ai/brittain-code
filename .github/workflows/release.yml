name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/sync-vendor.js --check
      - name: Validate stable release tag
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          test "${PACKAGE_VERSION#*-}" = "${PACKAGE_VERSION}"
          test -s "docs/releases/${PACKAGE_VERSION}.md"

  # electron-builder creates the draft if none exists, so parallel platform
  # jobs race and can each create one. Create it once, up front.
  draft:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create draft release
        run: |
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
          fi

  mac:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No Developer ID. afterSign.js does the deep ad-hoc re-sign that keeps
      # Gatekeeper on the ordinary "unidentified developer" path, and
      # UPDATE_ENABLED stays unset because Squirrel.Mac refuses to swap an app
      # it cannot verify a Developer ID signature for.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish macOS release
        run: npx electron-builder --config scripts/release-config.js --mac dmg zip --${{ matrix.arch }} --publish always
      - name: Verify Electron window security
        run: npx electron scripts/window-security-smoke.js
      # Both mac jobs upload latest-mac.yml and the later one overwrites the
      # other, so the publish job merges the two copies kept here.
      - uses: actions/upload-artifact@v4
        with:
          name: latest-mac-${{ matrix.arch }}
          path: dist/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: draft
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Unsigned NSIS builds still auto-update; only SmartScreen changes.
      UPDATE_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish Windows release
        run: npx electron-builder --config scripts/release-config.js --win --x64 --publish always
      - name: Verify Electron window security
        run: npx electron scripts/window-security-smoke.js

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: latest-mac-*
      - name: Merge latest-mac.yml
        run: |
          mkdir -p merged
          node scripts/merge-latest-mac.js latest-mac-x64/latest-mac.yml latest-mac-arm64/latest-mac.yml merged/latest-mac.yml
          gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" merged/latest-mac.yml --clobber
      - name: Publish complete release
        run: gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" --draft=false --latest
